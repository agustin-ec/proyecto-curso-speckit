[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-gastos"
version = "0.1.0"
description = "Sistema de control de gastos personales con FastAPI y MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Curso Certificación IA Gen", email = "dev@gastos.local" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/mcp/server.py",
    "app/mcp/auth.py",
    "app/logging_config.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
